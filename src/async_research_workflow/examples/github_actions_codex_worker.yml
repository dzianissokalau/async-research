name: Async Research Worker Example

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9,13,17 * * 1-5"

concurrency:
  group: async-research-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run one bounded worker task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_WORKER_OWNER: github-actions-${{ github.run_id }}
          RESEARCH_REPO_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p research_ops/run_artifacts/github-${{ github.run_id }}
          codex exec \
            --json \
            --cd "$RESEARCH_REPO_ROOT" \
            --sandbox workspace-write \
            --ask-for-approval never \
            --output-last-message /tmp/codex-worker-last-message.md \
            "You are the worker for the low-cost async research workflow. Direct script calls in this prompt are advanced/internal helpers. Read research_ops/queue.md, pick the oldest ready_for_worker task, then run async-research workflow worker-start <task-dir> --owner \"$RESEARCH_WORKER_OWNER\" --dry-run. If worker-start reports a fresh lock or invalid transition, skip that task and try the next ready task. Run async-research workflow worker-start <task-dir> --owner \"$RESEARCH_WORKER_OWNER\" before writing any output. Work only in that task's allowed_paths, write worker_output.md, and run async-research workflow worker-complete <task-dir> --owner \"$RESEARCH_WORKER_OWNER\" --dry-run before the final transition. If API or CLI usage metadata is visible, write it under the task artifacts and run async-research cost ingest-usage before final status validation. Run async-research workflow worker-complete <task-dir> --owner \"$RESEARCH_WORKER_OWNER\" to move the task to awaiting_review and release LOCK/, then stop after one task. Do not browse or use network unless status.json explicitly allows it." \
            > research_ops/run_artifacts/github-${{ github.run_id }}/codex_events.jsonl

          async-research cost ingest-usage \
            research_ops \
            --usage-file research_ops/run_artifacts/github-${{ github.run_id }}/codex_events.jsonl \
            --item-id github-${{ github.run_id }} \
            --role worker \
            --model codex-cli \
            --status completed \
            || echo "No ingestible usage metadata found in Codex JSON events."

      - name: Upload Codex JSON events
        uses: actions/upload-artifact@v4
        with:
          name: codex-worker-events-${{ github.run_id }}
          path: research_ops/run_artifacts/github-${{ github.run_id }}/codex_events.jsonl

      - name: Create pull request with worker output
        uses: peter-evans/create-pull-request@v6
        with:
          branch: async-research/worker-${{ github.run_id }}
          commit-message: "Run async research worker"
          title: "Async research worker output"
          body-path: /tmp/codex-worker-last-message.md
          labels: async-research
