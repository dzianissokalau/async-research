name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: pip install -e .
      - run: python -m unittest discover -s tests
      - run: async-research acceptance-suite
      - run: async-research benchmark
      - run: async-research starter-smoke /tmp/async-research-starter --force
      - run: python -m compileall src tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist --wheel
      - name: Install built wheel in a clean environment
        run: |
          python -m venv /tmp/async-research-wheel-venv
          /tmp/async-research-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/async-research-wheel-venv/bin/python -m pip install dist/*.whl
      - name: Smoke installed wheel
        run: |
          /tmp/async-research-wheel-venv/bin/async-research version
          /tmp/async-research-wheel-venv/bin/async-research acceptance-suite
          /tmp/async-research-wheel-venv/bin/async-research benchmark
          /tmp/async-research-wheel-venv/bin/async-research starter-smoke /tmp/async-research-wheel-generic --force
          /tmp/async-research-wheel-venv/bin/async-research starter-smoke /tmp/async-research-wheel-real-estate --template real-estate --force
