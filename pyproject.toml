[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "async-research-workflow"
version = "0.2.0a1"
description = "Installable alpha CLI and starter template for low-cost async research workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Dzianis Sokalau"}]
keywords = [
  "agent-workflows",
  "async-research",
  "cli",
  "governance",
  "human-in-the-loop",
  "research-automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dzianissokalau/async-research"
Repository = "https://github.com/dzianissokalau/async-research"
Issues = "https://github.com/dzianissokalau/async-research/issues"
Changelog = "https://github.com/dzianissokalau/async-research/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/dzianissokalau/async-research/blob/main/roadmaps/public_alpha_hardening_roadmap.md"

[project.scripts]
async-research = "async_research_workflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
async_research_workflow = [
  "*.json",
  "schemas/*.json",
  "schemas/*.schema.json",
  "templates/**/*.md",
  "templates/**/*.json",
  "templates/**/*.csv",
  "templates/**/*.jsonl",
  "templates/**/.gitkeep",
  # Protocol and operator docs are intentionally packaged; see DOCS_PACKAGING_REVIEW.md.
  "docs/**/*.md",
  "examples/**/*.yml",
  "benchmarks/**/*.json",
]
